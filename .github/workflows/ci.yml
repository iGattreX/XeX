name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the packages first, then type-checks tokens, ui and the docs site.
      - name: Type-check
        run: npm run typecheck

      - name: Build packages and docs site
        run: npm run build

      - name: Unit and component tests (includes structural accessibility checks)
        run: npm run test -w @xex/ui

      # Real-browser axe checks (WCAG 2.x A/AA, incl. colour contrast) for every theme in light and dark.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end accessibility tests
        run: npm run test:e2e -w @xex/docs

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: apps/docs/test-results
          if-no-files-found: ignore

      - name: Contrast audit (WCAG AA for every theme)
        run: npm run audit:contrast

      # Lists exactly what each package would publish; fails if packing breaks.
      - name: Check publishable contents
        run: npm run pack:check
