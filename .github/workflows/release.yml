name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
# Uses npm trusted publishing (OIDC): there is no npm token anywhere in this repo.
# Setup: on npmjs.com, for each package, Settings -> Trusted Publisher -> GitHub Actions:
#   owner iGattreX, repository xex, workflow filename release.yml (leave environment empty).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # lets npm exchange this workflow's identity for a publish credential

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Check the tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in tokens tailwind-preset ui; do
            version=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::Tag v$tag does not match packages/$dir ($version). Run: node scripts/set-version.mjs $tag"
              exit 1
            fi
          done

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Contrast audit
        run: npm run audit:contrast

      # Order matters: ui depends on tokens. Versions already on npm are skipped, so a re-run is safe.
      - name: Publish
        run: |
          for dir in tokens tailwind-preset ui; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish -w "$name" --access public --provenance
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
